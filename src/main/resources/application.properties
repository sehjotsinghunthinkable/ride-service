spring.application.name=ride-service

server.port = 8091

spring.datasource.url=jdbc:postgresql://localhost:5432/carpooling_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================================
# Redis Configuration
# ====================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=redis123
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=ride:

# Redisson Configuration
redisson.single-server-config.address=redis://localhost:6379
redisson.single-server-config.password=redis123
redisson.single-server-config.connection-pool-size=10
redisson.single-server-config.connection-minimum-idle-size=5
redisson.single-server-config.idle-connection-timeout=10000
redisson.single-server-config.connect-timeout=10000
redisson.single-server-config.timeout=3000
redisson.single-server-config.retry-attempts=3
redisson.single-server-config.retry-interval=1500

services.user-service.url =

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
